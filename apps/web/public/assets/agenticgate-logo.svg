<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left wing - outer feather -->
  <path d="M100 105 C85 95, 55 85, 30 60 C25 55, 22 48, 28 44 C34 40, 42 46, 50 54 C60 64, 72 78, 85 90 Z"
        fill="url(#wingGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Left wing - middle feather -->
  <path d="M100 108 C82 100, 50 95, 22 78 C16 74, 14 66, 20 63 C26 60, 35 65, 46 73 C60 83, 76 96, 92 106 Z"
        fill="url(#wingGrad)" opacity="0.75"/>

  <!-- Left wing - inner feather -->
  <path d="M100 112 C80 108, 48 110, 20 100 C13 97, 12 89, 18 87 C24 85, 34 89, 47 95 C62 102, 80 110, 96 114 Z"
        fill="url(#wingGrad)" opacity="0.55"/>

  <!-- Right wing - outer feather -->
  <path d="M100 105 C115 95, 145 85, 170 60 C175 55, 178 48, 172 44 C166 40, 158 46, 150 54 C140 64, 128 78, 115 90 Z"
        fill="url(#wingGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Right wing - middle feather -->
  <path d="M100 108 C118 100, 150 95, 178 78 C184 74, 186 66, 180 63 C174 60, 165 65, 154 73 C140 83, 124 96, 108 106 Z"
        fill="url(#wingGrad)" opacity="0.75"/>

  <!-- Right wing - inner feather -->
  <path d="M100 112 C120 108, 152 110, 180 100 C187 97, 188 89, 182 87 C176 85, 166 89, 153 95 C138 102, 120 110, 104 114 Z"
        fill="url(#wingGrad)" opacity="0.55"/>

  <!-- Gate / portal shape - center -->
  <rect x="82" y="72" width="36" height="46" rx="18" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Gate arch top highlight -->
  <ellipse cx="100" cy="72" rx="18" ry="8" fill="#e0e7ff" opacity="0.6"/>

  <!-- Gate inner dark -->
  <rect x="89" y="82" width="22" height="30" rx="11" fill="#0f172a" opacity="0.85"/>

  <!-- Gate inner glow dot -->
  <circle cx="100" cy="97" r="5" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Halo ring above -->
  <ellipse cx="100" cy="62" rx="22" ry="6" stroke="url(#wingGrad)" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#glow)"/>
</svg>
